name: file-organizer
manifest_version: 2
api_version: 1
version: 0.1.0
description: Preview and safely organize files inside explicitly allowed folders.
license: MIT
provides_tools:
  - file_organizer_preview
  - file_organizer_apply
  - file_organizer_undo
provides_hooks:
  - pre_tool_call
config_schema:
  allowed_roots:
    type: list
    default: []
    label: Allowed folders
    description: Absolute folders this plugin may scan and organize. Add only folders you trust.